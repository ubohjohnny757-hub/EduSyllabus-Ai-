<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRS Curriculum | EduSyllabus</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f6ff;
  color: #183153;
}

header {
  background: #123c69;
  color: white;
  text-align: center;
  padding: 22px 12px;
}

header h1 {
  margin: 0 0 8px;
}

header p {
  margin: 0;
}

main {
  max-width: 850px;
  margin: 20px auto;
  padding: 15px;
}

.back {
  display: inline-block;
  margin-bottom: 15px;
  color: #123c69;
  font-weight: bold;
  text-decoration: none;
}

h2 {
  text-align: center;
}

.classes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-bottom: 20px;
}

button {
  cursor: pointer;
  font-size: 15px;
  border: none;
  border-radius: 7px;
  padding: 12px;
}

.classes button {
  background: #d6e7ff;
  color: #123c69;
  font-weight: bold;
}

.classes button.active {
  background: #123c69;
  color: white;
}

.term-button {
  width: 100%;
  text-align: left;
  margin: 7px 0;
  background: #176b50;
  color: white;
  font-weight: bold;
}

.term-content {
  background: white;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 12px;
}

.lesson-button {
  width: 100%;
  text-align: left;
  margin: 5px 0;
  background: #e5efff;
  color: #123c69;
}

.lesson {
  background: #f8fbff;
  border-left: 4px solid #176b50;
  padding: 12px;
  margin: 5px 0 12px;
  border-radius: 5px;
  line-height: 1.6;
}

[hidden] {
  display: none !important;
}

footer {
  text-align: center;
  background: #123c69;
  color: white;
  padding: 15px;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <h1>EduSyllabus</h1>

  <p>Junior Secondary 1 to Senior Secondary 3</p>
</header>

<main>
  <a class="back" href="index.html">← Back to Home</a>

  <h2>Select Your Class</h2>
  <div class="classes" id="classButtons"></div>

  <div id="curriculum">
    <p>Select a class to view its CRS curriculum.</p>
  </div>
</main>

<footer>
  <p>EduSyllabus — Learn, Understand and Succeed</p>
</footer>

const classNames = ["JSS1", "JSS2", "JSS3", "SS1", "SS2", "SS3"];
const classButtons = document.getElementById("classButtons");
const output = document.getElementById("curriculum");

function showClass(className) {
  document.querySelectorAll(".classes button").forEach(function(button) {
    button.classList.toggle("active", button.dataset.class === className);
  });

  output.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = className + " CRS Curriculum";
  output.appendChild(heading);

  const terms = curriculum[className];

  Object.keys(terms).forEach(function(termName) {
    const termButton = document.createElement("button");
    termButton.className = "term-button";
    termButton.textContent = termName + " ▼";

    const termContent = document.createElement("div");
    termContent.className = "term-content";
    termContent.hidden = true;

    termButton.addEventListener("click", function() {
      termContent.hidden = !termContent.hidden;
      termButton.textContent = termName + (termContent.hidden ? " ▼" : " ▲");
    });

    terms[termName].forEach(function(topic) {
      const lessonButton = document.createElement("button");
      lessonButton.className = "lesson-button";
      lessonButton.textContent = topic[0] + " +";

      const lesson = document.createElement("div");
      lesson.className = "lesson";
      lesson.hidden = true;

      const explanation = document.createElement("p");
      explanation.textContent = topic[1];

      const reference = document.createElement("p");
      reference.textContent = "Bible reference: " + topic[2];

      lesson.appendChild(explanation);
      lesson.appendChild(reference);

      lessonButton.addEventListener("click", function() {
        lesson.hidden = !lesson.hidden;
        lessonButton.textContent = topic[0] + (lesson.hidden ? " +" : " −");
      });

      termContent.appendChild(lessonButton);
      termContent.appendChild(lesson);
    });

    output.appendChild(termButton);
    output.appendChild(termContent);
  });
}

classNames.forEach(function(className) {
  const button = document.createElement("button");
  button.textContent = className;
  button.dataset.class = className;
  button.addEventListener("click", function() {
    showClass(className);
  });
  classButtons.appendChild(button);
});

showClass("JSS1");
</script>

</body>
</html>
